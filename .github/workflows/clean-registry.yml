name: "Clean up registry"

on:
  delete:
  release:
    types: [published]
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Removed branch tag to clean up; leave empty for stable release cleanup"
        required: false
        type: string
      dry_run:
        description: "Preview without deleting images or pre-releases"
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

jobs:
  delete_images:
    if: github.repository == 'francio87/ns8-borgbackupserver' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: Registry
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check cleanup policy
        run: python3 tests/test_release_cleanup.py
      - name: Install official release tool
        run: gh extension install NethServer/gh-ns8-release-module
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Clean obsolete testing images and pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE_REF: ${{ (github.event_name == 'workflow_dispatch' && inputs.ref) || (github.event_name == 'delete' && github.event.ref) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch) || '' }}
          CHECK_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/clean-registry.py
